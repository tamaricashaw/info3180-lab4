{% extends 'base.html' %}

{% block main %}
<div class="container mt-4">
    <h1 class="page-header mb-4">Uploaded Files</h1>

    {% include 'flash_messages.html' %}

    {% if images %}
        <div class="row">
            {% for image in images %}
            <div class="col-md-4 col-sm-4 col-6 mb-4">
                <div class="card h-100">
                    <img src="{{ url_for('get_image', filename=image) }}" 
                         class="card-img-top" 
                         alt="{{ image }}"
                         style="height: 180px; object-fit: cover;">
                    <div class="card-body">
                        <p class="card-text text-truncate small">{{ image }}</p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="alert alert-info">
            No images uploaded yet. 
            <a href="{{ url_for('upload') }}" class="alert-link">Upload an image</a>
        </div>
    {% endif %}
</div>
{% endblock %}
